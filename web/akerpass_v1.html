<body>
<div id="map" aria-label="Karta över jordbruksskiften"></div>
<section id="control" class="control" aria-label="Kartkontroller">
 <header class="control-head">
  <div class="brand"><h1>ÅkerPass</h1><p>Skånes åkrar · tre separata dimensioner</p></div>
  <div class="head-actions"><button id="quickGps" class="icon-button" type="button" title="Min position" aria-label="Min position">📍</button><button id="collapse" class="icon-button" type="button" aria-label="Visa eller dölj kontroller">⌃</button></div>
 </header>
 <div class="control-body">
  <label class="label" for="municipality">Kommun</label>
  <select id="municipality" class="select"></select>
  <span class="label">Färglager</span>
  <div class="segmented" role="group" aria-label="Färglager">
   <button class="layer-button active" type="button" data-layer="score" title="Agronomiskt jordindex">ÅkerScore</button>
   <button class="layer-button" type="button" data-layer="value" title="Marknadsindex">ÅkerVärde</button>
   <button class="layer-button" type="button" disabled title="Maskinell brukbarhet. Modell kommer senare.">ÅkerDrift</button>
  </div>
  <div id="layerHint" class="hint"></div>
  <span class="label">Objekt</span>
  <div class="options"><label class="check"><input id="showFields" type="checkbox" checked> Skiften</label><label class="check"><input id="showBlocks" type="checkbox" checked> Blockgränser</label></div>
  <div class="gps-row"><button id="locate" class="action" type="button">📍 Min position</button><button id="follow" class="action" type="button" aria-pressed="false">📡 Följ mig: AV</button></div>
  <div id="status" class="status" aria-live="polite"></div>
 </div>
</section>
<aside id="legend" class="legend" aria-label="Färglegend"></aside>
<aside id="drawer" class="drawer" aria-hidden="true" aria-label="ÅkerPass för valt skifte">
 <header class="drawer-head"><div class="drawer-title"><strong>ÅkerPass</strong><span id="fieldIdentity"></span></div><button id="closeDrawer" class="close" type="button" aria-label="Stäng ÅkerPass-panel">×</button></header>
 <div id="drawerBody" class="drawer-body"></div>
</aside>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const MANIFEST=__MUNICIPALITIES_JSON__;
const ORG_LABELS={"2":"<2,5 %","3":"2,5–3,5 %","4":"3,5–4,5 %","5":"4,5–5,5 %","6":"5,5–6,5 %","9":"6,5–12 %","16":"12–20 %","30":"≥20 %"};
const SCORE_LEGEND=[{max:40,label:"<40",color:"#8c6d31"},{max:55,label:"40–55",color:"#c7a95a"},{max:70,label:"55–70",color:"#e5d68b"},{max:82,label:"70–82",color:"#b7d58b"},{max:92,label:"82–92",color:"#67ad67"},{max:98,label:"92–98",color:"#27814b"},{max:Infinity,label:"98–100",color:"#075b35"}];
const VALUE_LEGEND=[{max:40,label:"<40",color:"#7f3b3b"},{max:60,label:"40–60",color:"#b65b4a"},{max:80,label:"60–80",color:"#d99863"},{max:100,label:"80–100",color:"#ead78c"},{max:120,label:"100–120",color:"#a8c979",ref:true},{max:150,label:"120–150",color:"#4a9b61"},{max:Infinity,label:">150",color:"#12613e"}];
const map=L.map("map",{preferCanvas:true,zoomControl:false}).setView([55.82,13.45],9);
L.control.zoom({position:"topright"}).addTo(map);
const aerial=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Imagery © Esri and contributors"}).addTo(map);
const osm=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"});
L.control.layers({"Flygbild":aerial,"OpenStreetMap":osm},{},{position:"topright",collapsed:true}).addTo(map);
const ui={control:document.getElementById("control"),municipality:document.getElementById("municipality"),hint:document.getElementById("layerHint"),status:document.getElementById("status"),legend:document.getElementById("legend"),drawer:document.getElementById("drawer"),drawerBody:document.getElementById("drawerBody"),identity:document.getElementById("fieldIdentity"),showFields:document.getElementById("showFields"),showBlocks:document.getElementById("showBlocks"),follow:document.getElementById("follow")};
let activeLayer="score",fieldLayer=null,blockLayer=null,loadToken=0,gpsLayer=null,watchId=null,following=false,followHasFix=false,currentDocument=null;
function esc(value){if(value===null||value===undefined)return"–";return String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]))}
function valid(value){return value!==null&&value!==undefined&&Number.isFinite(Number(value))}
function fmt(value,digits=1){return valid(value)?Number(value).toLocaleString("sv-SE",{minimumFractionDigits:digits,maximumFractionDigits:digits}):"–"}
function intFmt(value){return valid(value)?Math.round(Number(value)).toLocaleString("sv-SE"):"–"}
function toast(message){const box=document.getElementById("toast");box.textContent=message;box.classList.add("show");clearTimeout(box.timer);box.timer=setTimeout(()=>box.classList.remove("show"),3000)}
function setStatus(message){ui.status.textContent=message}
function bins(){return activeLayer==="score"?SCORE_LEGEND:VALUE_LEGEND}
function fieldValue(properties){return activeLayer==="score"?properties.akerscore:properties.akervarde}
function fillColor(value){if(!valid(value))return"#b8bcb6";return bins().find(bin=>Number(value)<bin.max).color}
function fieldStyle(feature){return{color:"#f5f5ef",weight:.75,opacity:.9,fillColor:fillColor(fieldValue(feature.properties)),fillOpacity:.76}}
function renderLegend(){const title=activeLayer==="score"?"ÅkerScore · 0–100":"ÅkerVärde · index";const foot=activeLayer==="score"?"100 är extremnivå.":"100 är referensnivån för 2026. Indexet kan vara högre.";const missing=activeLayer==="score"?"data saknas":"ej tillämpligt / data saknas",collapsed=ui.legend.classList.contains("collapsed");ui.legend.innerHTML=`<button id="legendToggle" class="legend-toggle" type="button" aria-expanded="${String(!collapsed)}" title="${collapsed?'Visa färgskala':'Minimera färgskala'}" aria-label="${collapsed?'Visa färgskala':'Minimera färgskala'}">🎨</button><div class="legend-content"><div class="legend-title">${title}</div>${bins().map(bin=>`<div class="legend-row${bin.ref?' legend-ref':''}"><span class="legend-swatch" style="background:${bin.color}"></span><span>${bin.label}${bin.ref?' · referens':''}</span></div>`).join("")}<div class="legend-row"><span class="legend-swatch" style="background:#b8bcb6"></span><span>${missing}</span></div><div class="legend-foot">${foot}</div></div>`;document.getElementById("legendToggle").addEventListener("click",()=>{const next=!ui.legend.classList.contains("collapsed");ui.legend.classList.toggle("collapsed",next);renderLegend()})}
function renderHint(){ui.hint.textContent=activeLayer==="score"?"Agronomiskt jordindex 0–100. Högre värde innebär mer klass-10-lik topsoil-signatur.":"Marknadsindex. 100 motsvarar referensnivån för 2026. Indexet kan vara högre än 100."}
function setLayer(name){activeLayer=name;document.querySelectorAll("[data-layer]").forEach(button=>button.classList.toggle("active",button.dataset.layer===name));if(fieldLayer)fieldLayer.setStyle(fieldStyle);renderLegend();renderHint()}
function closeDrawer(){ui.drawer.classList.remove("open");ui.drawer.setAttribute("aria-hidden","true");ui.legend.classList.remove("drawer-open")}
function openDrawer(properties){ui.identity.textContent=`${properties.kommun} · block ${properties.block_id} · skifte ${properties.skifte_id}`;ui.drawerBody.innerHTML=fieldPanel(properties);ui.drawer.classList.add("open");ui.drawer.setAttribute("aria-hidden","false");ui.legend.classList.add("drawer-open");if(matchMedia("(max-width:700px)").matches)setCollapsed(true)}
function scoreCard(label,value,interval,intervalLabel,emptyTitle="–",emptyDetail="Data saknas"){return`<article class="score-card"><div class="score-label"><span>${label}</span></div><div class="score-value"${valid(value)?"":' style="font-size:20px;letter-spacing:0"'}>${valid(value)?intFmt(value):esc(emptyTitle)}</div><div class="score-interval">${valid(interval[0])&&valid(interval[1])?`${intervalLabel}: ${intFmt(interval[0])}–${intFmt(interval[1])}`:esc(emptyDetail)}</div></article>`}
function detailRows(rows){const available=rows.filter(row=>row[1]!==null&&row[1]!==undefined&&row[1]!==""&&row[1]!=="–");if(!available.length)return'<div class="section-note empty">Data saknas</div>';return`<div class="detail-grid">${available.map(row=>`<span>${row[0]}</span><b>${row[1]}</b>`).join("")}</div>`}
function metric(value,digits,unit=""){return valid(value)?`${fmt(value,digits)}${unit}`:null}
function fieldPanel(p){const soil=p.soil||{},clay=soil.clay||{},silt=soil.silt||{},sand=soil.sand||{},organic=soil.organic||{},topo=p.topography||{},hydro=p.hydrology||{},geom=p.geometry_metrics||{},qa=p.qa||{},models=p.model_versions||{},valueNA=p.akervarde_applicability!=="applicable",scoreReason=p.akerscore_status_reason||"ÅkerScore kunde inte beräknas.";return`
 <div class="score-grid">${scoreCard("ÅkerScore",p.akerscore,[p.akerscore_p10,p.akerscore_p90],"Inomfältsvariation P10–P90","Data saknas",scoreReason)}${scoreCard("ÅkerVärde",p.akervarde,[p.akervarde_p10,p.akervarde_p90],"Prediktionsintervall P10–P90",valueNA?"Ej tillämpligt":"Data saknas",valueNA?(p.akervarde_applicability_reason||"Markanvändningen ligger utanför målpopulationen."):"Data saknas")}<article class="score-card drift"><div class="score-label"><span>ÅkerDrift</span></div><div class="score-value" style="font-size:20px;letter-spacing:0">Kommer senare</div><div class="score-interval">Maskinell brukbarhet. Ingen poäng är ännu fryst.</div></article></div>
 <div class="area-card"><span>Areal</span><b>${metric(p.area_ha,1," ha")||"–"}</b></div>
 <div class="explanation">ÅkerScore beskriver jordens agronomiska topsoil-signatur. ÅkerVärde är ett separat marknadsindex där 100 motsvarar referensnivån för 2026.</div>
 <details><summary>Jord</summary>${detailRows([["Lera · medel",metric(clay.mean_pct,1," %")],["Lera · P10–P90",valid(clay.p10_pct)&&valid(clay.p90_pct)?`${fmt(clay.p10_pct,1)}–${fmt(clay.p90_pct,1)} %`:null],["Silt · medel",metric(silt.mean_pct,1," %")],["Sand · medel",metric(sand.mean_pct,1," %")],["Mullklass",organic.mode_code!==null?ORG_LABELS[String(Math.round(organic.mode_code))]||fmt(organic.mode_code,0):null],["Jordtäckning",metric(qa.soil_coverage_pct??clay.coverage_pct,1," %")],["Giltiga jordpixlar",valid(qa.soil_pixels_valid)?intFmt(qa.soil_pixels_valid):null]])}</details>
 <details><summary>Topografi</summary><div class="section-note">Måtten avser blocket som skiftet ligger i.</div>${detailRows([["Medelhöjd",metric(topo.elev_mean_m,1," m")],["Höjd P05–P95",valid(topo.elev_p05_m)&&valid(topo.elev_p95_m)?`${fmt(topo.elev_p05_m,1)}–${fmt(topo.elev_p95_m,1)} m`:null],["Relief P95–P05",metric(topo.relief_p95_p05_m,1," m")],["Medellutning",metric(topo.slope_mean_deg,2,"°")],["Lutning P90",metric(topo.slope_p90_deg,2,"°")],["Lokal lågterräng",metric(topo.local_low50_lt_m0p25_pct,1," %")],["DEM-täckning",metric(topo.dem_coverage_pct,0," %")]])}</details>
 <details><summary>Hydrologi</summary><div class="section-note">Topografisk våthetsbenägenhet på blocknivå.</div>${detailRows([["TWI medel",metric(hydro.twi_mean,2)],["TWI P90",metric(hydro.twi_p90,2)],["Våtaste 10 % av åkermark",metric(hydro.twi_ge_farmland_p90_pct,1," %")],["Våtaste 5 % av åkermark",metric(hydro.twi_ge_farmland_p95_pct,1," %")],["ln(SCA) P90",metric(hydro.ln_sca_p90,2)],["TWI-täckning",metric(hydro.twi_coverage_pct,0," %")]])}</details>
 <details><summary>Geometri</summary>${detailRows([["Geometrisk area",metric(geom.area_ha,2," ha")],["Rectangularity",metric(geom.rectangularity,3)],["Compactness · 4πA/P²",metric(geom.compactness_4piA_P2,3)],["Convexity",metric(geom.convexity,3)],["MBR-aspekt",metric(geom.mbr_aspect_ratio,2)],["MBR långsida",metric(geom.mbr_long_m,1," m")],["Hål",valid(geom.hole_count)?intFmt(geom.hole_count):null]])}</details>
 <details><summary>Historik / referens</summary>${detailRows([["Historisk jordbruksklass 1971 — referensdata",valid(p.historic_class)?intFmt(p.historic_class):esc(p.historic_class_status_label||"Ej klass 5–10 i importerat underlag")],["Markanvändning 2025",p.land_use_label?esc(p.land_use_label):null],["Gröda 2025",p.crop_name?esc(p.crop_name):null],["Grödkod 2025",p.crop_code?esc(p.crop_code):null],["Block-ID",esc(p.block_id)],["Skiftes-ID",esc(p.skifte_id)]])}</details>
 <details><summary>Modell / data</summary>${detailRows([["ÅkerScore modell",esc(models.akerscore)],["ÅkerVärde modell",esc(models.akervarde)],["Dataset",esc(models.dataset)],["Inom block",metric(qa.inside_block_pct,1," %")],["Alignment-varning",qa.alignment_warning?"Ja":"Nej"]])}</details>`}
function onEachField(feature,layer){layer.on("click",()=>openDrawer(feature.properties));layer.bindTooltip(()=>{const p=feature.properties,label=activeLayer==="score"?"ÅkerScore":"ÅkerVärde",shown=activeLayer==="value"&&p.akervarde_applicability!=="applicable"?"Ej tillämpligt":intFmt(fieldValue(p));return`Skifte ${esc(p.skifte_id)} · ${label} ${shown}`},{sticky:true,direction:"top"})}
async function loadMunicipality(name){const meta=MANIFEST.municipalities[name];if(!meta)return;const token=++loadToken;setStatus(`Laddar ${name}…`);closeDrawer();try{const response=await fetch(meta.file,{cache:"no-cache"});if(!response.ok)throw new Error(`HTTP ${response.status}`);const documentData=await response.json();if(token!==loadToken)return;currentDocument=documentData;if(fieldLayer)map.removeLayer(fieldLayer);if(blockLayer)map.removeLayer(blockLayer);blockLayer=L.geoJSON(documentData.blocks,{style:{color:"#45324c",weight:1.25,opacity:.7,fillOpacity:0},interactive:false});fieldLayer=L.geoJSON(documentData.fields,{style:fieldStyle,onEachFeature:onEachField});if(ui.showBlocks.checked)blockLayer.addTo(map);if(ui.showFields.checked)fieldLayer.addTo(map);const bounds=fieldLayer.getBounds();if(bounds.isValid())map.fitBounds(bounds,{padding:[18,18]});setStatus(`${meta.fields.toLocaleString("sv-SE")} skiften · ${meta.blocks.toLocaleString("sv-SE")} block`);history.replaceState(null,"",`${location.pathname}?kommun=${encodeURIComponent(name)}`)}catch(error){console.error(error);setStatus("Kunde inte ladda kommunen");toast("Kommunens kartdata kunde inte laddas. Kör sidan via en lokal webbserver.")}}
function populateMunicipalities(){Object.keys(MANIFEST.municipalities).forEach(name=>{const option=document.createElement("option");option.value=name;option.textContent=name;ui.municipality.appendChild(option)});const requested=new URLSearchParams(location.search).get("kommun");const initial=MANIFEST.municipalities[requested]?requested:(MANIFEST.municipalities.Lomma?"Lomma":Object.keys(MANIFEST.municipalities)[0]);ui.municipality.value=initial;loadMunicipality(initial)}
function setCollapsed(value){ui.control.classList.toggle("collapsed",value);document.getElementById("collapse").textContent=value?"⌄":"⌃";setTimeout(()=>map.invalidateSize(),230)}
function updateGps(position,pan,closeZoom=false){const lat=position.coords.latitude,lon=position.coords.longitude,accuracy=position.coords.accuracy;if(gpsLayer)gpsLayer.remove();gpsLayer=L.layerGroup([L.circle([lat,lon],{radius:accuracy,color:"#d7263d",weight:1,opacity:.5,fillColor:"#d7263d",fillOpacity:.04,interactive:false}),L.circleMarker([lat,lon],{radius:6,color:"white",weight:2,fillColor:"#d7263d",fillOpacity:1,className:"gps-dot"}).bindTooltip(`Noggrannhet cirka ${Math.round(accuracy)} m`)]).addTo(map);if(pan){const target=[lat,lon];closeZoom?map.setView(target,Math.max(map.getZoom(),16)):map.panTo(target,{animate:false})}}
function locationError(error){const messages={1:"Platsåtkomst nekades i webbläsaren.",2:"Positionen är inte tillgänglig.",3:"Positionssökningen tog för lång tid."};toast(messages[error.code]||"Kunde inte läsa positionen.")}
function locate(){if(!navigator.geolocation){toast("Webbläsaren saknar platsstöd.");return}setStatus("Söker position…");navigator.geolocation.getCurrentPosition(position=>{updateGps(position,true,true);setStatus("Position hittad")},locationError,{enableHighAccuracy:true,timeout:12000,maximumAge:10000})}
function setFollowing(next){if(!navigator.geolocation){toast("Webbläsaren saknar platsstöd.");return}following=next;ui.follow.classList.toggle("active",following);ui.follow.setAttribute("aria-pressed",String(following));ui.follow.textContent=following?"📡 Följ mig: PÅ":"📡 Följ mig: AV";if(following){followHasFix=false;watchId=navigator.geolocation.watchPosition(position=>{updateGps(position,true,!followHasFix);followHasFix=true},error=>{locationError(error);setFollowing(false)},{enableHighAccuracy:true,timeout:15000,maximumAge:3000})}else if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}}
document.querySelectorAll("[data-layer]").forEach(button=>button.addEventListener("click",()=>setLayer(button.dataset.layer)));ui.municipality.addEventListener("change",()=>loadMunicipality(ui.municipality.value));ui.showFields.addEventListener("change",()=>{if(!fieldLayer)return;ui.showFields.checked?fieldLayer.addTo(map):map.removeLayer(fieldLayer)});ui.showBlocks.addEventListener("change",()=>{if(!blockLayer)return;ui.showBlocks.checked?blockLayer.addTo(map):map.removeLayer(blockLayer)});document.getElementById("collapse").addEventListener("click",()=>setCollapsed(!ui.control.classList.contains("collapsed")));document.getElementById("closeDrawer").addEventListener("click",closeDrawer);document.getElementById("locate").addEventListener("click",locate);document.getElementById("quickGps").addEventListener("click",locate);ui.follow.addEventListener("click",()=>setFollowing(!following));window.addEventListener("beforeunload",()=>{if(watchId!==null)navigator.geolocation.clearWatch(watchId)});document.addEventListener("keydown",event=>{if(event.key==="Escape")closeDrawer()});
renderLegend();renderHint();populateMunicipalities();
</script>
</body>
</html>
